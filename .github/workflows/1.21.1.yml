name: 1.21.1 Build
on:
  push:
    branches:
      - "1.21.1"
  pull_request:

env:
  MINECRAFT_VERSION: "1.21.1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Loom Cache
        uses: actions/cache@v5
        with:
          path: "**/.gradle/loom-cache"
          key: "${{ env.MINECRAFT_VERSION }}-loom-${{ hashFiles('settings.gradle.kts', 'gradle.properties', '**/gradle-wrapper.properties', '**/*.accesswidener') }}"

      - name: Elevate wrapper permissions
        run: chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # read only on pull requests, otherwise allow writes
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build Mod
        run: ./gradlew build

      - name: Upload Fabric Artifact
        uses: actions/upload-artifact@v7
        with:
          name: "WorldDownloadX"
          path: "build/libs/*.jar"
          if-no-files-found: error
